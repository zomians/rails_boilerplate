# config/localesディレクトリ内のファイルは国際化に使用され、
# Railsによって自動的に読み込まれます。英語以外のロケールを使用する場合は、
# このディレクトリに必要なファイルを追加してください。
#
# ロケールを使用するには、`I18n.t`を使用します：
#
#     I18n.t "hello"
#
# ビューでは、これは単に`t`としてエイリアスされています：
#
#     <%= t("hello") %>
#
# 異なるロケールを使用するには、`I18n.locale`で設定します：
#
#     I18n.locale = :ja
#
# これにより、config/locales/ja.ymlの情報が使用されます。
#
# APIの詳細については、Rails国際化ガイドをお読みください：
# https://guides.rubyonrails.org/i18n.html
#
# YAMLは以下の大文字小文字を区別しない文字列をブール値として解釈することに注意してください：
# `true`, `false`, `on`, `off`, `yes`, `no`。したがって、これらの文字列は
# 文字列として解釈されるために引用符で囲む必要があります。例：
#
#     ja:
#       "yes": はい
#       enabled: "ON"

ja:
  hello: "こんにちは"

  # アプリケーション共通の翻訳
  common:
    created: "作成されました"
    updated: "更新されました"
    deleted: "削除されました"
    save: "保存"
    edit: "編集"
    delete: "削除"
    cancel: "キャンセル"
    back: "戻る"
    confirm: "確認"
    search: "検索"
    submit: "送信"
    show: "表示"
    new: "新規作成"
    back_to: "%{name}一覧に戻る"
    are_you_sure: "本当に削除しますか？"
    no_records_found: "%{name}が見つかりません"

  # 日時フォーマット
  time:
    formats:
      default: "%Y年%m月%d日 %H:%M:%S"
      short: "%m月%d日 %H:%M"
      long: "%Y年%m月%d日(%a) %H時%M分%S秒"

  date:
    formats:
      default: "%Y年%m月%d日"
      short: "%m月%d日"
      long: "%Y年%m月%d日(%a)"

  # Posts関連の翻訳
  posts:
    title: "投稿"
    title_singular: "投稿"
    index:
      title: "投稿一覧"
      new_post: "新規投稿"
      no_posts: "投稿が見つかりません"
    show:
      title: "投稿詳細"
      edit: "この投稿を編集"
      back: "投稿一覧に戻る"
      destroy: "この投稿を削除"
    new:
      title: "新規投稿"
      back: "投稿一覧に戻る"
    edit:
      title: "投稿を編集"
      show: "この投稿を表示"
      back: "投稿一覧に戻る"
    form:
      error_message: "%{count}個のエラーがあります"
    messages:
      created: "投稿が正常に作成されました"
      updated: "投稿が正常に更新されました"
      destroyed: "投稿が正常に削除されました"

  # ActiveRecord属性名
  activerecord:
    models:
      post: "投稿"
    attributes:
      post:
        content: "内容"
